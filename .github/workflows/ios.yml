name: ios
on:
  pull_request:
    paths: ['apps/ios/**', 'api/**', 'design/**', 'tools/**', 'deny.toml', '.agents/rules/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['apps/ios/**', 'api/**', 'design/**', 'tools/**', 'deny.toml', '.agents/rules/**', '.github/workflows/ios.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: '26.6'
      - run: brew install xcodegen swiftlint xcodes
      - run: tools/contract/python.sh --install
      - run: tools/codegen/generate.sh --check --platform ios
      - run: tools/ci/check-swift.sh
      - run: tools/ci/check-package-graph.sh
      - run: python3 tools/ci/check-api-boundary.py
      - name: Generate and build app
        working-directory: apps/ios
        run: |
          xcodegen generate
          mkdir -p Gauja.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved Gauja.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild -project Gauja.xcodeproj -scheme Gauja -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData -skipPackagePluginValidation -onlyUsePackageVersionsFromResolvedFile build CODE_SIGNING_ALLOWED=NO
      - name: Swift Testing packages
        run: |
          for package in Model Compat SeerrAPI Network Data; do
            swift test --package-path "apps/ios/Packages/$package" --disable-automatic-resolution
          done
      - run: python3 tools/ci/check-licenses.py ios
      - run: python3 tools/ci/replay-contract.py ios
      - run: tools/ci/egress-test.sh ios
      - name: Phone and tablet smoke
        run: |
          xcodebuild -downloadPlatform iOS
          xcodes runtimes install "iOS 18.6"
          python3 tools/ci/ios-smoke.py
      - name: Device architecture size report
        working-directory: apps/ios
        run: |
          xcodebuild -project Gauja.xcodeproj -scheme Gauja -configuration Release -destination 'generic/platform=iOS' -derivedDataPath DerivedData -skipPackagePluginValidation build CODE_SIGNING_ALLOWED=NO DEPLOYMENT_POSTPROCESSING=YES STRIP_INSTALLED_PRODUCT=YES
          du -sk DerivedData/Build/Products/Release-iphoneos/Gauja.app
