# iOS lane (PRD §14.2): XcodeGen, build, Swift Testing, swift-format lint, SwiftLint strict,
# package-graph check, generated-code drift, simulator smoke, egress test. Wired in Phase 3.3.
name: ios

on:
  pull_request:
    paths:
      - "apps/ios/**"
      - "api/**"
      - "design/**"
      - "tools/codegen/**"
      - "tools/contract/**"
      - "tools/tokens/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - "api/**"
      - "design/**"
      - "tools/codegen/**"
      - "tools/contract/**"
      - "tools/tokens/**"

permissions:
  contents: read

jobs:
  placeholder:
    name: ios (not yet wired)
    runs-on: ubuntu-latest
    steps:
      - run: echo "ios lane is not yet wired; see docs/gauja-implementation-plan.md (§3.3)."
