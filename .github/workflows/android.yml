name: android
on:
  pull_request:
    paths: ['apps/android/**', 'api/**', 'design/**', 'tools/**', 'deny.toml', '.agents/rules/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['apps/android/**', 'api/**', 'design/**', 'tools/**', 'deny.toml', '.agents/rules/**', '.github/workflows/android.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - name: Expose installed Android tools
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - run: sdkmanager 'platforms;android-37.0'
      - run: tools/contract/python.sh --install
      - run: tools/codegen/generate.sh --check --platform android
      - run: apps/android/gradlew --project-dir apps/android assembleDebug assembleRelease testDebugUnitTest :core:api:test :core:model:test :core:compat:test :core:network:test detekt ktfmtCheck lint buildHealth exportResolvedDependencies
      - run: tools/ci/check-module-graph.sh
      - run: python3 tools/ci/check-api-boundary.py
      - run: python3 tools/ci/check-licenses.py android
      - run: python3 tools/ci/replay-contract.py android
      - run: tools/ci/egress-test.sh android
      - name: Per-ABI release APK sizes
        run: ls -l apps/android/app/build/outputs/apk/release/*.apk
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: ['30', '37.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - name: Expose installed Android tools
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator smoke
        env:
          API: ${{ matrix.api }}
          ANDROID_AVD_HOME: ${{ runner.temp }}/android/avd
        run: |
          export ANDROID_USER_HOME="$HOME/.android"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          sdkmanager 'emulator' 'platforms;android-37.0' "system-images;android-$API;google_apis;x86_64"
          echo no | avdmanager create avd --force --name gauja-smoke --package "system-images;android-$API;google_apis;x86_64"
          test -f "$ANDROID_AVD_HOME/gauja-smoke.ini"
          adb start-server
          test -f "$ANDROID_USER_HOME/adbkey"
          "$ANDROID_HOME/emulator/emulator" -avd gauja-smoke -no-window -no-audio -no-snapshot -no-metrics -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &
          trap 'adb emu kill || true' EXIT
          timeout 180 adb wait-for-device
          timeout 180 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 2; done'
          apps/android/gradlew --project-dir apps/android connectedDebugAndroidTest
      - name: Emulator startup log
        if: failure()
        run: test ! -f /tmp/emulator.log || cat /tmp/emulator.log
