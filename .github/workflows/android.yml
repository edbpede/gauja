#
# Android lane (PRD §14.2): build, unit tests, ktfmt, detekt, Android Lint, module-graph check,
# generated-code drift, emulator smoke, baseline profile, egress test. Wired in Phase 3.2.
name: android

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "api/**"
      - "design/**"
      - "tools/codegen/**"
      - "tools/contract/**"
      - "tools/tokens/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "api/**"
      - "design/**"
      - "tools/codegen/**"
      - "tools/contract/**"
      - "tools/tokens/**"

permissions:
  contents: read

jobs:
  placeholder:
    name: android (not yet wired)
    runs-on: ubuntu-latest
    steps:
      - run: echo "android lane is not yet wired; see docs/gauja-implementation-plan.md (§3.2)."
