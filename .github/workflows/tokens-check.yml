name: tokens-check

on:
  pull_request:
    paths: ['design/tokens.json', 'tools/tokens/**', 'tools/codegen/outputs.py', 'apps/android/core/designsystem/**', 'apps/ios/Packages/DesignSystem/**', '.github/workflows/tokens-check.yml']
  push:
    branches: [main]
    paths: ['design/tokens.json', 'tools/tokens/**', 'tools/codegen/outputs.py', 'apps/android/core/designsystem/**', 'apps/ios/Packages/DesignSystem/**', '.github/workflows/tokens-check.yml']

permissions:
  contents: read

jobs:
  tokens:
    name: tokens-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: tools/tokens/generate.sh --check
  ios-primitives:
    name: tokens-ios
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.6'
      - name: Typecheck generated SwiftUI primitives at iOS 18 floor
        run: |
          xcrun swiftc -typecheck -swift-version 6 -default-isolation MainActor \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" -target arm64-apple-ios18.0-simulator \
            apps/ios/Packages/DesignSystem/Sources/DesignSystem/Generated/*.swift
