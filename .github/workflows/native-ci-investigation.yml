name: native-ci-investigation
on:
  push:
    branches: [fix/phase-3-ci-stability]
    paths: ['tools/ci/android-smoke.py', 'tools/tests/ci/test_android_smoke.py', '.github/workflows/native-ci-investigation.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  api37-investigation:
    name: API 37 A1 supported RAM
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EMULATOR_BUILD: '15917651'
      EMULATOR_SHA256: 95771e0ae431897b2a4bd2d97fa095f29a8b0624a7b216baf529f9306161c266
      MEMORY_MIB: '4096'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - name: Record host and expose SDK tools
        run: |
          export EVIDENCE="$RUNNER_TEMP/native-ci"
          echo "EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/gauja-android/avd" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE/provision"
          {
            date -u
            git show -s --format=fuller HEAD
            env | sort | sed -n '/^ImageOS=/p; /^ImageVersion=/p; /^GITHUB_RUN_ID=/p; /^GITHUB_RUN_ATTEMPT=/p; /^GITHUB_SHA=/p'
            uname -a
            lscpu
            free -h
            df -h
          } > "$EVIDENCE/provision/host.txt"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Provision fixed API 37 pairing
        run: |
          export ANDROID_USER_HOME="$HOME/.android"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME" "$RUNNER_TEMP/gauja-emulator"
          sdkmanager 'platforms;android-37.0' 'system-images;android-37.0;google_apis;x86_64' > "$EVIDENCE/provision/sdk-install.log" 2>&1
          sdkmanager --list_installed > "$EVIDENCE/provision/sdk-packages.txt"
          curl --fail --location --retry 2 --connect-timeout 30 --max-time 180 \
            "https://dl.google.com/android/repository/emulator-linux_x64-$EMULATOR_BUILD.zip" -o "$RUNNER_TEMP/gauja-emulator.zip"
          echo "$EMULATOR_SHA256  $RUNNER_TEMP/gauja-emulator.zip" | sha256sum -c -
          sha256sum "$RUNNER_TEMP/gauja-emulator.zip" > "$EVIDENCE/provision/archive-sha256.txt"
          unzip -q "$RUNNER_TEMP/gauja-emulator.zip" -d "$RUNNER_TEMP/gauja-emulator"
          echo no | avdmanager create avd --name gauja-probe --device pixel_4 --package 'system-images;android-37.0;google_apis;x86_64' > "$EVIDENCE/provision/avd-create.log" 2>&1
          sed -i '/^disk.dataPartition.size=/d' "$ANDROID_AVD_HOME/gauja-probe.avd/config.ini"
          echo 'disk.dataPartition.size=10G' >> "$ANDROID_AVD_HOME/gauja-probe.avd/config.ini"
      - name: Run bounded probe
        run: |
          export ANDROID_USER_HOME="$HOME/.android"
          python3 tools/ci/android-smoke.py \
            --emulator "$RUNNER_TEMP/gauja-emulator/emulator/emulator" \
            --avd gauja-probe --serial emulator-5554 --api 37.0 --image-revision 6 \
            --memory-mib "$MEMORY_MIB" --evidence-dir "$EVIDENCE/android"
      - name: Retain investigation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-investigation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}
          retention-days: 7
          if-no-files-found: error
