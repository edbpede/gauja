name: codegen-check

on:
  pull_request:
    paths: ['api/**', 'LICENSES/MIT.txt', 'tools/contract/**', 'tools/api-drift/**', 'tools/codegen/**', 'tools/tests/codegen/**', 'apps/android/core/api/**', 'apps/ios/Packages/SeerrAPI/**', '.github/workflows/codegen-check.yml']
  push:
    branches: [main]
    paths: ['api/**', 'LICENSES/MIT.txt', 'tools/contract/**', 'tools/api-drift/**', 'tools/codegen/**', 'tools/tests/codegen/**', 'apps/android/core/api/**', 'apps/ios/Packages/SeerrAPI/**', '.github/workflows/codegen-check.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: tools/contract/python.sh --install
      - name: Validate each commit and the current contract
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: tools/api-drift/check-local.sh --range "$BASE" "$HEAD"
      - name: Verify vendored bytes at the pin
        run: tools/contract/python.sh tools/api-drift/check-upstream.py
