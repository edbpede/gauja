name: Feature request
description: Propose a change within Gauja's scope (a native companion to your own Seerr server).
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Out of scope for v1 (see `docs/gauja-prd.md` §2.2 and Appendix B of the implementation plan): push notifications, background polling, media playback, web views, the setup wizard, telemetry, Play Services.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: input
    id: seerr-endpoint
    attributes:
      label: Seerr endpoint(s) involved
      placeholder: /api/v1/request, /api/v1/settings/radarr
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: ["Android", "iOS"]
