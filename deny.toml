#
# Dependency license allow-list (PRD §10, §14.1 `license-check`).
# Policy for resolved-dependency enforcement with real app manifests in Phase 3.
# This is a project format, not cargo-deny; Gauja has no Rust.
# Every dependency of either app must resolve to an allowed SPDX identifier; unknown or
# unacceptable licenses must fail the future resolved-dependency check.
# An identifier alone does not establish compatibility; review conditions and scope.

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
]

# EPL-2.0 is accepted only for Gradle build plugins. EPL-1.0 is accepted only
# for the mandated JUnit 4 test runner. Neither is shipped in an app.
allow-build-only = [
  "PSF-2.0", # typing-extensions, contract tooling only
  "EPL-2.0",
  "EPL-1.0",
]

deny = [
  "GPL-2.0-only",
  "LGPL-2.0-only",
  "SSPL-1.0",
  "BUSL-1.1",
  "CC-BY-NC-4.0",
  "Proprietary",
]

# Anything not listed above is rejected until a maintainer adds it here with a rationale.
unknown = "deny"
