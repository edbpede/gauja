# Dependency license allow-list (PRD §10, §14.1 `license-check`).
# Read by tools/ci/check-licenses.sh (a project format, not cargo-deny; Gauja has no Rust).
# Every dependency of either app must resolve to an allowed SPDX identifier; unknown or
# GPL-incompatible licenses fail CI. AGPL-3.0-or-later is compatible with all of these.

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "PSF-2.0", # typing-extensions, build-only contract tooling
]

# EPL-2.0 is accepted only for Gradle build plugins. EPL-1.0 is accepted only
# for the mandated JUnit 4 test runner. Neither is shipped in an app.
allow-build-only = [
  "EPL-2.0",
  "EPL-1.0",
]

deny = [
  "GPL-2.0-only",
  "LGPL-2.0-only",
  "SSPL-1.0",
  "BUSL-1.1",
  "CC-BY-NC-4.0",
  "Proprietary",
]

# Anything not listed above is rejected until a maintainer adds it here with a rationale.
unknown = "deny"
