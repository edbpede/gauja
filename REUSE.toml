# SPDX-FileCopyrightText: 2026 Gauja contributors
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# REUSE (https://reuse.software) annotations for the whole tree (PRD §15.1).
# Files that carry their own SPDX header keep it ("closest" precedence); everything
# else (dotfiles, CODEOWNERS, rule files with YAML front matter, JSON) is covered here.
# "The license" means AGPL-3.0-or-later together with APPSTORE_EXCEPTION.md (see LICENSE).

version = 1

[[annotations]]
path = ["**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Gauja contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Generated clients include inherited MIT spec descriptions. These annotations
# preserve upstream attribution alongside Gauja contributions without editing output.
[[annotations]]
path = ["apps/android/core/api/**", "apps/ios/Packages/SeerrAPI/Generated/**"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 Gauja contributors", "2020 sct"]
SPDX-License-Identifier = "AGPL-3.0-or-later AND MIT"

# Imported palette values flow from tokens into both generated themes.
[[annotations]]
path = [
  "design/tokens.json",
  "apps/android/core/designsystem/src/main/kotlin/**/generated/**",
  "apps/ios/Packages/DesignSystem/Sources/DesignSystem/Generated/**",
]
precedence = "override"
SPDX-FileCopyrightText = ["2026 Gauja contributors", "Tailwind Labs, Inc."]
SPDX-License-Identifier = "AGPL-3.0-or-later AND MIT"

# Vendored upstream contract: Seerr's OpenAPI specification stays MIT (PRD §4.1, §15.1).
# The exact pinned Seerr notice and REUSE license text share LICENSES/MIT.txt.
[[annotations]]
path = ["api/seerr-api.yml"]
precedence = "override"
SPDX-FileCopyrightText = "2020 sct"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["design/LICENSE.tailwind"]
precedence = "override"
SPDX-FileCopyrightText = "Tailwind Labs, Inc."
SPDX-License-Identifier = "MIT"
